name: Build Android APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "dist/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      xray_version:
        description: "Xray-core release tag"
        required: false
        default: "v26.3.27"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_VERSION: "8.11.1"
      XRAY_VERSION: ${{ github.event.inputs.xray_version || 'v26.3.27' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare log file
        run: |
          mkdir -p dist
          rm -f dist/build.log
          {
            echo "FFH VPN build log"
            echo "run:      ${{ github.run_number }} (${{ github.sha }})"
            echo "xray:     $XRAY_VERSION"
            echo "gradle:   $GRADLE_VERSION"
            echo "date:     $(date -u +%FT%TZ)"
          } > dist/build.log

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK root: $SDK"
          if [ -w "$(dirname "$SDK")" ]; then
            mkdir -p "$SDK"
          else
            sudo mkdir -p "$SDK"
            sudo chown -R "$(id -u):$(id -g)" "$SDK"
          fi
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing command line tools"
            curl -fsSL --retry 3 -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf "$SDK/cmdline-tools/latest" "$SDK/cmdline-tools/cmdline-tools"
            mkdir -p "$SDK/cmdline-tools"
            unzip -q -o /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            if [ -d "$SDK/cmdline-tools/cmdline-tools" ] && [ ! -d "$SDK/cmdline-tools/latest" ]; then
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5

      - name: Fetch Xray core
        id: xray
        continue-on-error: true
        run: bash .github/scripts/fetch-xray.sh "$XRAY_VERSION" 2>&1 | tee -a dist/build.log

      - name: Install Gradle
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo rm -rf "/opt/gradle/gradle-${GRADLE_VERSION}"
          sudo mkdir -p /opt/gradle
          sudo unzip -q -o -d /opt/gradle /tmp/gradle.zip
          sudo ln -sfn "/opt/gradle/gradle-${GRADLE_VERSION}/bin/gradle" /usr/local/bin/gradle
          gradle --version | head -5 | tee -a dist/build.log

      - name: Generate Gradle wrapper
        id: wrapper
        continue-on-error: true
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin 2>&1 | tee -a dist/build.log | tail -40
          echo "--- wrapper files ---" >> dist/build.log
          ls -la gradle/wrapper 2>&1 | tee -a dist/build.log

      - name: Build
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          if [ -x ./gradlew ]; then GRADLE_CMD=./gradlew; else GRADLE_CMD=gradle; fi
          echo "== using $GRADLE_CMD" >> dist/build.log
          $GRADLE_CMD --no-daemon --stacktrace --console=plain \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee -a dist/build.log

      - name: Test report
        continue-on-error: true
        run: |
          echo "== unit test results ==" >> dist/build.log
          if [ -d app/build/test-results ]; then
            for f in $(find app/build/test-results -name '*.xml'); do
              if grep -q "<failure" "$f"; then
                echo "===== $f" >> dist/build.log
                sed -e 's/&quot;/"/g' "$f" >> dist/build.log
              fi
            done
          fi
          tail -60 dist/build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p dist
          rm -f dist/*.apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \; 2>/dev/null || true
          for apk in dist/*.apk; do
            [ -e "$apk" ] || continue
            {
              echo "== $apk ($(du -h "$apk" | cut -f1))"
              unzip -l "$apk" | grep -E "lib/.*so$|classes.*dex" | head -10
            } >> dist/build.log
          done
          {
            echo "== jniLibs"
            find app/src/main/jniLibs -type f -printf '    %p (%s bytes)\n' 2>/dev/null || echo "    (empty)"
            echo "== dist"
            ls -la dist
          } >> dist/build.log

      - name: Publish artifacts to the branch
        if: always()
        run: |
          git config user.name "ffh-ci"
          git config user.email "ffh-ci@users.noreply.github.com"
          git add -f dist
          git add -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "build: android artifacts (run ${{ github.run_number }}) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload job artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffh-vpn-apk
          path: dist/*.apk
          if-no-files-found: warn

      - name: Fail the job when the build failed
        if: always()
        run: |
          if [ "${{ steps.gradle.outcome }}" != "success" ] || [ "${{ steps.xray.outcome }}" != "success" ]; then
            echo "::error::Build failed, see dist/build.log in the repository"
            exit 1
          fi

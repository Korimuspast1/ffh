name: Build Android APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "dist/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      xray_version:
        description: "Xray-core release tag"
        required: false
        default: "v26.3.27"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_VERSION: "8.11.1"
      XRAY_VERSION: ${{ github.event.inputs.xray_version || 'v26.3.27' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Fetch Xray core
        run: bash .github/scripts/fetch-xray.sh "$XRAY_VERSION"

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo rm -rf "/opt/gradle-${GRADLE_VERSION}"
          sudo unzip -q -o -d /opt/gradle /tmp/gradle.zip
          sudo ln -sfn "/opt/gradle/gradle-${GRADLE_VERSION}/bin/gradle" /usr/local/bin/gradle
          gradle --version | head -5

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          rm -f dist/*.apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          find app/build/outputs -name "*.aab" -exec cp {} dist/ \; || true
          ls -la dist
          for apk in dist/*.apk; do
            echo "== $apk"
            unzip -l "$apk" | grep -E "lib/.*libxray.so|classes.*dex" | head -8
          done

      - name: Publish artifacts to the branch
        run: |
          git config user.name "ffh-ci"
          git config user.email "ffh-ci@users.noreply.github.com"
          git add -f dist
          git add -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "build: android apk (${GITHUB_RUN_NUMBER}) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload job artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffh-vpn-apk
          path: dist/*.apk
          if-no-files-found: error

name: Build Lexora WebView APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0e2ce-ffh
    paths:
      - 'webview-release/**'
      - '.github/workflows/build-webview-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Ensure Android SDK 34 exists
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" || true
      - name: Build release APK
        run: gradle -p webview-release :app:assembleRelease --stacktrace
      - name: Copy APK
        run: |
          mkdir -p release-artifacts
          cp webview-release/app/build/outputs/apk/release/app-release.apk release-artifacts/lexora-webview-real.apk
          sha256sum release-artifacts/lexora-webview-real.apk > release-artifacts/lexora-webview-real.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lexora-webview-real-apk
          path: release-artifacts/*
